<!-- Form for the contact page -->
<form>
    <label for="name">Youre Preferred
        Denomination</label>
    <input id="name" name="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="subject">Youre Desire</label>
    <select id="subject" name="subject" required>
        <option value="">Choose youre Desire🔥...</option>
        <option value="booking">Make An Booking🕐</option>
        <option value="press">Tidings-Bearer✉️</option>
        <option value="fan">Love Letter💌</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>

    <button type="submit">Forward with the Mail!📨</button>
</form>
